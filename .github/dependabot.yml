---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "mcgroarty"
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      all-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
